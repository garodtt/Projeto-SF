<template>
    <lightning-card title="Chamados Técnicos" icon-name="standard:case">

        <div slot="actions">
            <lightning-input
                type="search"
                label="Buscar por número"
                placeholder="Ex: CH-0001"
                value={termoDeBusca}
                onchange={handleMudancaNaBusca}
                variant="label-hidden"
            ></lightning-input>
        </div>

        <div class="slds-p-horizontal_medium">
            <template if:true={estaCarregando}>
                <lightning-spinner alternative-text="Carregando" size="small"></lightning-spinner>
            </template>

            <template if:false={estaCarregando}>

                <template if:true={nenhumResultadoEncontrado}>
                    <div class="slds-align_absolute-center slds-p-around_medium slds-text-color_weak">
                        Nenhum chamado encontrado para essa busca.
                    </div>
                </template>

                <template if:false={nenhumResultadoEncontrado}>
                    <table class="slds-table slds-table_bordered slds-table_striped">
                        <thead>
                            <tr class="slds-line-height_reset">
                                <th scope="col">Número</th>
                                <th scope="col">Cliente</th>
                                <th scope="col">Equipamento</th>
                                <th scope="col">Status</th>
                                <th scope="col">Prioridade</th>
                                <th scope="col">Data de Abertura</th>
                                <th scope="col">SLA</th>
                                <th scope="col"></th>
                            </tr>
                        </thead>
                        <tbody>
                            <template for:each={chamados} for:item="chamado">
                                <tr key={chamado.Id} class={chamado.classeDaLinha}>
                                    <td class="celula-clicavel" data-id={chamado.Id} onclick={handleClickNaLinha}>{chamado.Name}</td>
                                    <td>{chamado.nomeDoCliente}</td>
                                    <td>{chamado.Equipamento__r.Name}</td>
                                    <td>
                                        <span class={chamado.classeDoStatus}>{chamado.Status__c}</span>
                                    </td>
                                    <td>
                                        <span class={chamado.classeDaPrioridade}>{chamado.Prioridade__c}</span>
                                    </td>
                                    <td>{chamado.dataAberturaFormatada}</td>
                                    <td>
                                        <template if:true={chamado.slaVencido}>
                                            <span class="slds-badge slds-theme_error">SLA Vencido</span>
                                        </template>
                                        <template if:false={chamado.slaVencido}>
                                            <span class="slds-text-color_weak">{chamado.slaFormatado}</span>
                                        </template>
                                    </td>
                                    <td>
                                        <template if:true={chamado.temAcaoDisponivel}>
                                            <lightning-button-menu
                                                alternative-text="Ações"
                                                icon-name="utility:threedots_vertical"
                                                data-id={chamado.Id}
                                                data-proximo-status={chamado.proximoStatus}
                                                onselect={handleSelecionarAcao}
                                            >
                                                <lightning-menu-item
                                                    value={chamado.proximoStatus}
                                                    label={chamado.rotuloDaAcao}
                                                ></lightning-menu-item>
                                            </lightning-button-menu>
                                        </template>
                                    </td>
                                </tr>
                            </template>
                        </tbody>
                    </table>

                    <div class="slds-p-around_medium slds-align_absolute-center">
                        <lightning-button
                            label="Anterior"
                            onclick={handlePaginaAnterior}
                            disabled={desabilitarBotaoAnterior}
                            class="slds-m-right_small"
                        ></lightning-button>

                        <span class="slds-p-horizontal_small">Página {paginaAtual} de {totalDePaginas}</span>

                        <lightning-button
                            label="Próxima"
                            onclick={handleProximaPagina}
                            disabled={desabilitarBotaoProxima}
                            class="slds-m-left_small"
                        ></lightning-button>
                    </div>
                </template>
            </template>
        </div>

    </lightning-card>
</template>
